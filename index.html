<title>Остров котокроликов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: весь экран занимает 3D-остров; интерфейс как наклейки с толстой чёрной обводкой (в стиле toon-обводки игр) лежит поверх по краям */
:root{
  --ink:#1d1633;
  --paper:#fffdf6;
  --muted:#5d5672;
  --orange:#ff7a2f;
  --blue:#2f6bff;
  --sun:#ffd23f;
  --sky:#9dd6f7;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#scene.drag{cursor:grabbing}
#scene.hot{cursor:pointer}
.ui{position:fixed;inset:0;pointer-events:none}
.ui > *{pointer-events:auto}

.brand{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 16px);pointer-events:none}
.brand h1{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(24px,4.2vw,46px);line-height:.95;letter-spacing:-.01em;color:var(--paper);
  -webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);text-wrap:balance}
.brand h1 span{color:var(--sun)}
.brand p{margin:.55rem 0 0;font-weight:800;font-size:14px;color:var(--ink);background:var(--paper);display:inline-block;padding:4px 10px;border:2.5px solid var(--ink);border-radius:999px;box-shadow:0 3px 0 var(--ink)}

.social{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;gap:8px}

.btn{font:800 14px/1 var(--body);color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:10px 14px;box-shadow:0 4px 0 var(--ink);
  cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s,box-shadow .08s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.btn.primary{background:var(--orange);color:var(--paper);-webkit-text-stroke:0;font-family:var(--display);font-weight:700;font-size:15px;padding:13px 18px;letter-spacing:.01em}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;text-decoration:underline;text-underline-offset:3px;padding:10px 6px}
.btn.ghost:active{transform:none}
.btn[aria-disabled="true"]{background:#e6e2ee;color:var(--muted);cursor:default}
.btn .short{display:none}
.btn .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink)}

.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;transform:translate(-50%,-100%);pointer-events:auto;font:700 13px/1 var(--display);color:var(--ink);background:var(--paper);
  border:3px solid var(--ink);border-radius:12px;padding:8px 11px;box-shadow:0 4px 0 var(--ink);cursor:pointer;white-space:nowrap;transition:background .15s,color .15s,opacity .2s}
.tag::after{content:"";position:absolute;left:50%;bottom:-10px;width:12px;height:12px;background:inherit;border:3px solid var(--ink);border-top:0;border-left:0;transform:translateX(-50%) rotate(45deg);border-radius:0 0 3px 0}
.tag.on{background:var(--sun)}
.tag.dim{opacity:.0;pointer-events:none}
.tag:focus-visible{outline:3px solid var(--blue);outline-offset:3px}

.dock{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;gap:8px;max-width:calc(100% - 32px);overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.dock::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto}
.chip[aria-pressed="true"]{background:var(--sun)}

.card{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 86px);width:min(390px,calc(100% - 32px));background:var(--paper);
  border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:18px 18px 16px;display:grid;gap:12px;
  transition:transform .35s cubic-bezier(.2,1.4,.4,1),opacity .2s}
.card.off{transform:translateY(24px) scale(.96);opacity:0;pointer-events:none}
.card .eyebrow{font:800 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.card .eyebrow i{width:12px;height:12px;border-radius:50%;border:2.5px solid var(--ink);display:inline-block}
.card h2{margin:0;font:900 clamp(22px,3vw,28px)/1.05 var(--display);letter-spacing:-.01em;text-wrap:balance}
.card p{margin:0;font-size:15px;line-height:1.5;color:var(--ink);max-width:60ch}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
.facts dt{color:var(--muted);font-weight:700}
.facts dd{margin:0;font-weight:800}
.actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.close{position:absolute;right:10px;top:10px;width:34px;height:34px;padding:0;border-radius:10px;font-size:18px;box-shadow:0 3px 0 var(--ink)}

.hint{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 24px);font-weight:800;font-size:13px;color:var(--ink);opacity:.75;pointer-events:none;transition:opacity .6s}
.hint.gone{opacity:0}

.loader{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(#7cc5f2,#ffe0c2);z-index:5;transition:opacity .6s}
.loader.gone{opacity:0;pointer-events:none}
.loader div{font:900 22px/1.2 var(--display);color:var(--paper);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink);text-align:center;padding:0 16px}
.loader small{display:block;margin-top:10px;font:800 14px var(--body);-webkit-text-stroke:0;text-shadow:none;color:var(--ink)}

@media (max-width:720px){
  .hint{display:none}
  .card{left:16px;right:16px;width:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 80px);padding:16px 14px 14px;gap:10px}
  .card p{font-size:14px}
  .brand p{font-size:12px}
  .social .btn{padding:8px 10px;font-size:13px}
  .tag{font-size:11px;padding:6px 8px}
}
@media (max-width:420px){ .social .btn .txt{display:none} .social .btn .short{display:inline} .social .btn{padding:8px 10px} }
@media (prefers-reduced-motion:reduce){ .card,.btn,.tag{transition:none} }
</style>

<canvas id="scene" aria-label="Трёхмерный остров с играми про котокролика. Тяните, чтобы повернуть остров, нажмите на домик, чтобы открыть игру."></canvas>

<div class="ui">
  <div class="labels" id="labels"></div>

  <header class="brand">
    <h1>Остров <span>котокроликов</span></h1>
    <p>Все игры про котокролика в одном месте</p>
  </header>

  <nav class="social" aria-label="Соцсети">
    <a class="btn" id="tg" href="https://t.me/CabbitJumpNews" target="_blank" rel="noopener"><span class="dot" style="background:#2aa3e0"></span><span class="txt">Telegram</span><span class="short">ТГ</span></a>
    <a class="btn" id="tt" href="https://www.tiktok.com/@cabbitgame" target="_blank" rel="noopener"><span class="dot" style="background:#ff2d6f"></span><span class="txt">TikTok</span><span class="short">ТТ</span></a>
  </nav>

  <section class="card off" id="card" aria-live="polite">
    <button class="btn close" id="close" type="button" aria-label="Закрыть">&times;</button>
    <div class="eyebrow"><i id="cDot"></i><span id="cEye"></span></div>
    <h2 id="cTitle"></h2>
    <p id="cText"></p>
    <dl class="facts" id="cFacts"></dl>
    <div class="actions">
      <a class="btn primary" id="cGo" target="_blank" rel="noopener"></a>
      <button class="btn ghost" id="cBack" type="button">К острову</button>
    </div>
  </section>

  <nav class="dock" id="dock" aria-label="Игры острова"></nav>
  <div class="hint" id="hint">Тяни, чтобы покрутить остров</div>
</div>

<div class="loader" id="loader"><div>Остров всплывает<small id="lmsg">загружаем 3D</small></div></div>

const INK = new THREE.MeshBasicMaterial({ color: '#1d1633', side: THREE.BackSide });

// обводка «вывернутой оболочкой»: копия геометрии, раздутая на t во все стороны
function outline(mesh, t = 0.05) {
  const g = mesh.geometry; g.computeBoundingBox();
  const s = new THREE.Vector3(), c = new THREE.Vector3();
  g.boundingBox.getSize(s); g.boundingBox.getCenter(c);
  const o = new THREE.Mesh(g, INK);
  const k = new THREE.Vector3(
    s.x > 1e-4 ? (s.x + 2 * t / mesh.scale.x) / s.x : 1,
    s.y > 1e-4 ? (s.y + 2 * t / mesh.scale.y) / s.y : 1,

  const m = new THREE.Mesh(geo, typeof color === 'string' ? toon(color) : color);

  if (o.s) { if (typeof o.s === 'number') m.scale.setScalar(o.s); else m.scale.set(o.s[0], o.s[1], o.s[2]); }

const sky = new THREE.Mesh(new THREE.SphereGeometry(500, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,

scene.add(new THREE.HemisphereLight('#d6ecff', '#c9a487', 1.35));

Object.assign(sunL.shadow.camera, { left: -17, right: 17, top: 17, bottom: -17, near: 5, far: 90 });

sunL.shadow.bias = -0.0006; sunL.shadow.normalBias = 0.03;
scene.add(sunL);

// ---------------- остров ----------------
const R = 11;
{
  const top = G.cyl(R, R + 0.3, 1.2, 56);
  const pos = top.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i), r = Math.hypot(x, z);
    if (r > 1) { const a = Math.atan2(z, x), k = 1 + 0.035 * Math.sin(a * 5) + 0.02 * Math.sin(a * 11 + 1); pos.setX(i, x * k); pos.setZ(i, z * k); }
  }
  top.computeVertexNormals();
  part(top, '#7fd162', { p: [0, 0, 0], t: 0.07 });
  part(G.cyl(R + 0.25, R - 0.6, 1.5, 40), '#c98552', { p: [0, -1.3, 0], t: 0.07 });
  part(G.cyl(R - 0.6, R - 1.6, 1.2, 36), '#a86d4b', { p: [0, -2.6, 0], t: 0.07 });
  part(G.cone(R - 1.6, 9, 9), '#8c7aa6', { p: [0, -7.7, 0], r: [Math.PI, 0.2, 0], t: 0.07 });
  part(G.cone(4, 4, 7), '#9d8ab5', { p: [3.5, -6.5, 2.5], r: [Math.PI, 0, 0] });
  part(G.cone(3, 3.5, 7), '#9d8ab5', { p: [-4, -5.8, -2], r: [Math.PI, 0.5, 0] });
  // центральная площадка
  part(G.cyl(2.3, 2.4, 0.2, 32), '#efe0bd', { p: [0, 0.65, 0], t: 0.04 });
}

// дорожки из камушков к каждой точке
seed = 11;
for (const pl of PLACES) {
  for (let r = 2.8; r < 5.2; r += 0.75) {
    const p = polar(pl.angle + (srand() - 0.5) * 0.12, r, 0.62);
    part(G.cyl(0.32, 0.34, 0.1, 10), '#efe0bd', { p: [p.x, p.y, p.z], r: [0, srand() * 3, 0], t: 0.035, shadow: false });

// пруд и водопад
const waterMat = new THREE.ShaderMaterial({
  transparent: true, side: THREE.DoubleSide, depthWrite: false, fog: true, uniforms: THREE.UniformsUtils.merge([THREE.UniformsLib.fog, { time: { value: 0 } }]),
  vertexShader: `varying vec2 vUv;
#include <fog_pars_vertex>
    void main(){ vUv = uv; vec4 mvPosition = modelViewMatrix * vec4(position,1.); gl_Position = projectionMatrix * mvPosition;
#include <fog_vertex>
    }`,
  fragmentShader: `varying vec2 vUv; uniform float time;
#include <fog_pars_fragment>
    void main(){
      float y = vUv.y * 9. + time * 2.6;
      float s = step(.82, fract(y + sin(vUv.x * 9. + floor(y) * 1.7) * .25));
      vec3 c = mix(vec3(.30,.70,.96), vec3(.93,.98,1.), s);
      c = mix(c, vec3(.2,.55,.9), smoothstep(.3,.0,abs(vUv.x-.5)) * .25);
      float a = smoothstep(0., .25, vUv.y);
      gl_FragColor = vec4(c, a * .95);
#include <fog_fragment>

    }`
});
waterMat.fog = true;
{
  const a = 0, pp = polar(a, 8.3, 0.62);
  part(G.cyl(1.6, 1.6, 0.06, 28), '#58bff2', { p: [pp.x, 0.63, pp.z], t: 0.05, shadow: false });
  part(G.cyl(1.25, 1.25, 0.07, 28), '#8fd6f7', { p: [pp.x, 0.64, pp.z], line: false, shadow: false });
  part(G.box(2.1, 0.06, 0.8), '#58bff2', { p: [pp.x + 1.6, 0.63, pp.z], line: false, shadow: false });

  fall.position.set(R + 0.72, -5.8, 0); fall.rotation.y = -Math.PI / 2;

}

// деревья, кусты, цветы
function tree(x, z, s = 1, kind = 0) {
  const g = new THREE.Group(); g.position.set(x, 0.6, z); g.scale.setScalar(s); scene.add(g);
  part(G.cyl(0.18, 0.26, 1.4, 8), '#8a5a3c', { p: [0, 0.7, 0], to: g });

    part(G.cone(0.75, 1.3, 9), '#4fb36a', { p: [0, 2.6, 0], to: g });
  }

}
seed = 3;

  $('cFacts').innerHTML = pl.facts.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('');
  const go = $('cGo'), url = LINKS[pl.link];
  if (url) { go.href = url; go.textContent = pl.go; go.removeAttribute('aria-disabled'); go.tabIndex = 0; }
  else { go.removeAttribute('href'); go.textContent = 'Ссылка скоро'; go.setAttribute('aria-disabled', 'true'); }
  card.classList.remove('off');
  const p = pl.pos;
  const narrow = innerWidth < 720;
  const yaw = -pl.angle + Math.PI / 2 + (narrow ? 0 : 0.15);
  const side = narrow ? 0 : 3.2;
  cam.goal = { yaw, pitch: narrow ? 0.3 : 0.36, dist: narrow ? 27 : 18,
    target: new THREE.Vector3(p.x - Math.cos(yaw) * side, narrow ? -3.5 : 3.4, p.z + Math.sin(yaw) * side) };
  idle = 0;
}
$('close').addEventListener('click', () => select(null));
$('cBack').addEventListener('click', () => select(null));
addEventListener('keydown', e => {
  if (e.key === 'Escape') select(null);
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    const n = PLACES.length, i = sel ? PLACES.indexOf(sel) : (e.key === 'ArrowRight' ? -1 : 0);
    select(PLACES[(i + (e.key === 'ArrowRight' ? 1 : n - 1)) % n]);
  }
});

// ---------------- камера ----------------
function overview() {
  const a = innerWidth / Math.max(1, innerHeight);
  return { yaw: cam ? cam.yaw : 0.5, pitch: 0.42, dist: a < 0.8 ? 52 : (a < 1.2 ? 40 : 33), target: new THREE.Vector3(0, a < 0.8 ? 1.5 : 2.2, 0), free: true };
}
let cam = null;
cam = { yaw: 0.5, pitch: 0.55, dist: 60, target: new THREE.Vector3(0, 2, 0) };
cam.goal = overview(); cam.goal.yaw = 0.45;
let idle = 0;

const ptr = new Map(); let drag = null, pinch = 0, moved = 0;
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(x, y) {
  ndc.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const h = ray.intersectObjects(hitMeshes, false)[0];
  return h ? h.object.userData.place : null;
}
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId); ptr.set(e.pointerId, [e.clientX, e.clientY]);
  if (ptr.size === 1) { drag = [e.clientX, e.clientY]; moved = 0; }
  if (ptr.size === 2) { const v = [...ptr.values()]; pinch = Math.hypot(v[0][0] - v[1][0], v[0][1] - v[1][1]); drag = null; moved = 99; }
});
cv.addEventListener('pointermove', e => {
  if (!ptr.has(e.pointerId)) {
    if (e.pointerType === 'mouse') { hover = pick(e.clientX, e.clientY); cv.classList.toggle('hot', !!hover); }
    return;
  }
  ptr.set(e.pointerId, [e.clientX, e.clientY]);
  if (ptr.size === 2 && pinch) {
    const v = [...ptr.values()], d = Math.hypot(v[0][0] - v[1][0], v[0][1] - v[1][1]);
    cam.goal.dist = THREE.MathUtils.clamp(cam.goal.dist * pinch / d, 12, 70); pinch = d; return;
  }
  if (!drag) return;
  const dx = e.clientX - drag[0], dy = e.clientY - drag[1]; drag = [e.clientX, e.clientY];
  moved += Math.abs(dx) + Math.abs(dy);
  if (moved > 6) {
    cv.classList.add('drag'); $('hint').classList.add('gone');
    cam.goal.yaw -= dx * 0.006; cam.goal.pitch = THREE.MathUtils.clamp(cam.goal.pitch + dy * 0.004, 0.08, 1.2);
    idle = 0;
  }
});
const up = e => {
  if (ptr.has(e.pointerId) && ptr.size === 1 && moved <= 6) {
    const pl = pick(e.clientX, e.clientY);
    if (pl) select(pl); else if (sel) select(null);
  }
  ptr.delete(e.pointerId); if (ptr.size < 2) pinch = 0; if (!ptr.size) { drag = null; cv.classList.remove('drag'); }
};
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
cv.addEventListener('wheel', e => { e.preventDefault(); cam.goal.dist = THREE.MathUtils.clamp(cam.goal.dist * Math.exp(e.deltaY * 0.001), 12, 70); idle = 0; }, { passive: false });

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  if (!sel) { const o = overview(); cam.goal.dist = o.dist; cam.goal.target = o.target; }
}
addEventListener('resize', resize); resize();

// ---------------- цикл ----------------
const clock = new THREE.Clock();
const tmp = new THREE.Vector3();
let t = 0, started = false;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05); t += dt * (RM ? 0.4 : 1);
  idle += dt;
  if (!sel && cam.goal.free && idle > 4 && !RM) cam.goal.yaw += dt * 0.06;
  const k = 1 - Math.exp(-dt * 3.2);
  let dy = cam.goal.yaw - cam.yaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy));
  cam.yaw += dy * k; cam.pitch += (cam.goal.pitch - cam.pitch) * k; cam.dist += (cam.goal.dist - cam.dist) * k;
  cam.target.lerp(cam.goal.target, k);
  camera.position.set(
    cam.target.x + Math.sin(cam.yaw) * Math.cos(cam.pitch) * cam.dist,
    cam.target.y + Math.sin(cam.pitch) * cam.dist,
    cam.target.z + Math.cos(cam.yaw) * Math.cos(cam.pitch) * cam.dist);
  camera.lookAt(cam.target);

  waterMat.uniforms.time.value = t;
  for (const f of anim) f(t, dt);
  for (const c of clouds) { c.a += c.sp * dt; c.g.position.set(Math.cos(c.a) * c.r, c.y + Math.sin(t * 0.3 + c.r) * 0.4, Math.sin(c.a) * c.r); }

  // котокролик: дышит, иногда подпрыгивает, смотрит на выбранную игру
  const look = sel || hover;
  const want = look ? Math.atan2(look.pos.x, look.pos.z) : Math.atan2(camera.position.x, camera.position.z);
  let dr = want - cab.root.rotation.y; dr = Math.atan2(Math.sin(dr), Math.cos(dr));
  cab.root.rotation.y += dr * (1 - Math.exp(-dt * 4));
  const hopT = t % 5.5, hop = hopT < 0.55 ? Math.sin(hopT / 0.55 * Math.PI) : 0;
  cab.body.position.y = hop * 0.7;
  cab.body.scale.set(1 + Math.sin(t * 2.2) * 0.012, 1 + Math.sin(t * 2.2 + 1) * 0.02 + hop * 0.06 - (hopT > 0.5 && hopT < 0.7 ? 0.06 : 0), 1);
  cab.head.rotation.x = Math.sin(t * 0.9) * 0.05 - (look ? 0.08 : 0);
  cab.head.rotation.z = Math.sin(t * 0.7) * 0.06;
  cab.ears[0].rotation.z = -0.42 - hop * 0.5 + Math.sin(t * 1.8) * 0.05;
  cab.ears[1].rotation.z = 0.42 + hop * 0.5 - Math.sin(t * 1.8 + 0.5) * 0.05;

  for (const pl of PLACES) {
    const on = pl === sel || pl === hover;
    pl.lift += ((on ? 1 : 0) - pl.lift) * (1 - Math.exp(-dt * 8));
    pl.inner.position.y = pl.lift * 0.25;
    pl.ring.material.opacity = pl.lift * (0.65 + 0.35 * Math.sin(t * 5));
    pl.ring.scale.setScalar(1 + Math.sin(t * 3) * 0.02);
    tmp.copy(pl.pos); tmp.y += pl.id === 'jump' ? 10.6 : (pl.id === 'pet' ? 5.6 : 4.4);
    tmp.project(camera);
    const vis = tmp.z < 1 && Math.abs(tmp.x) < 1.1 && Math.abs(tmp.y) < 1.1;
    pl.tag.classList.toggle('dim', !vis || (sel && sel !== pl && innerWidth < 720));
    pl.tag.style.transform = `translate(${(tmp.x * 0.5 + 0.5) * innerWidth}px, ${(-tmp.y * 0.5 + 0.5) * innerHeight}px) translate(-50%, -100%)`;
  }

  renderer.render(scene, camera);
  if (!started) { started = true; $('loader').classList.add('gone'); }
  requestAnimationFrame(frame);
}

const fontsReady = Promise.race([document.fonts ? document.fonts.ready : Promise.resolve(), new Promise(r => setTimeout(r, 1500))]);
fontsReady.then(() => { bookBuilders.forEach(f => f()); requestAnimationFrame(frame); });
setTimeout(() => $('hint').classList.add('gone'), 9000);
</script>
